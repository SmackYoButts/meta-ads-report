name: On-Demand Report (Telegram)

on:
  schedule:
    - cron: "*/5 * * * *"  # every 5 minutes, 24/7
  workflow_dispatch:  # manual trigger from GitHub UI

jobs:
  check-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check for /report command
        id: check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "trigger=true" >> $GITHUB_OUTPUT
          elif python check_telegram.py; then
            echo "trigger=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check.outputs.trigger == 'true'
        run: pip install -r requirements.txt

      - name: Write credentials.json
        if: steps.check.outputs.trigger == 'true'
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Run report
        if: steps.check.outputs.trigger == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_URL: ${{ secrets.GOOGLE_SHEET_URL }}
          GOOGLE_CREDENTIALS_JSON_PATH: credentials.json
        run: python report.py --now
